[project]
name = "online-retail-warehouse"
version = "1.0.0"
description = "Production-style ETL and analytical warehouse for online retail sales"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.5",
  "pandas==2.3.3",
  "pyarrow==25.0.1",
  "reportlab==5.0.0",
]

[project.scripts]
retail-etl = "retail_etl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
